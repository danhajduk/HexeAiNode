version: "2.3"

services:
  comfyui:
    build:
      context: .
      dockerfile: docker/comfyui/Dockerfile
      args:
        COMFYUI_REF: ${COMFYUI_REF:-master}
    image: ${COMFYUI_IMAGE:-hexe-ai-node-comfyui:local}
    container_name: ${COMFYUI_CONTAINER_NAME:-hexe-ai-node-comfyui}
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      HF_HOME: /cache/huggingface
      XDG_CACHE_HOME: /cache
    ports:
      - "${COMFYUI_HOST:-127.0.0.1}:${COMFYUI_PORT:-8188}:8188"
    volumes:
      - ${COMFYUI_MODEL_DIR:-./runtime/models/comfyui}:/opt/ComfyUI/models
      - ${COMFYUI_INPUT_DIR:-./runtime/input/comfyui}:/opt/ComfyUI/input
      - ${COMFYUI_OUTPUT_DIR:-./runtime/output/comfyui}:/opt/ComfyUI/output
      - ${COMFYUI_USER_DIR:-./runtime/user/comfyui}:/opt/ComfyUI/user
      - ${COMFYUI_CACHE_DIR:-./runtime/cache/comfyui}:/cache
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8188/system_stats >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
